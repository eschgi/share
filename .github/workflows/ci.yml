name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: webui-dist
          path: server/internal/webui/dist/
          include-hidden-files: true
          retention-days: 7

  server:
    name: Server
    needs: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: webui-dist
          path: server/internal/webui/dist/
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - name: Test (with the race detector and the 120 MiB upload)
        run: go test -race ./...
      - name: Build for the router and a VPS
        run: |
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" -o /tmp/share-linux-$arch ./cmd/share
          done
          ls -l /tmp/share-linux-*
      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  app:
    name: App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Test (without the golden screenshots, which depend on font rendering)
        run: flutter test
      - name: Android unit tests and lint, both flavors
        run: |
          flutter build apk --config-only
          cd android
          ./gradlew --console=plain testDirectDebugUnitTest testPlayDebugUnitTest lintDirectDebug
