name: CI

# Every push to main leaves the server for Linux and Windows, and the signed APK, as artifacts
# for a day. A tag such as v0.1.0 also publishes them as a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: webui-dist
          path: server/internal/webui/dist/
          include-hidden-files: true
          retention-days: 1

  server:
    name: Server
    needs: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      # PostgreSQL 18, the oldest version Share supports and the one the Docker setups run. Every
      # test makes a schema of its own there.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: share
          POSTGRES_PASSWORD: share
          POSTGRES_DB: share
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U share"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SHARE_TEST_POSTGRES: postgres://share:share@127.0.0.1:5432/share?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags, for the version in the binaries
      - uses: actions/download-artifact@v8
        with:
          name: webui-dist
          path: server/internal/webui/dist/
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - name: Test (with the race detector and the 120 MiB upload)
        run: go test -race ./...
      - name: Build for Linux and Windows, on arm64 and amd64
        # As scripts/build-linux.sh and scripts/build-windows.sh do, with the website from above.
        run: |
          version=$(git describe --tags --always)
          mkdir -p ../dist
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$version" -o ../dist/share-linux-$arch ./cmd/share
            CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$version" -o ../dist/share-windows-$arch.exe ./cmd/share
          done
          (cd ../dist && sha256sum share-* > SHA256SUMS)
          ls -l ../dist
      - uses: actions/upload-artifact@v7
        with:
          name: share-server
          path: dist/
          retention-days: 1
      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker:
    # Every push checks that the image builds; a version tag also publishes it as
    # ghcr.io/<owner>/share with the version, the minor version and latest (not for a tag
    # with a dash, a pre-release).
    name: Docker image
    needs: server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags, for the version in the image
      - uses: docker/setup-buildx-action@v4
      - name: Check the Caddy setup
        working-directory: deploy/docker/caddy
        run: POSTGRES_PASSWORD=unused docker compose config --quiet
      - name: Build the image for this machine
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ghcr.io/eschgi/share:latest
          cache-from: type=gha
      - name: Start Share and its database as the tunnel's setup does
        # Without the tunnel: Share has to become healthy and reach PostgreSQL 18.
        working-directory: deploy/docker/cloudflared
        run: |
          cp config.example.json config.json
          printf 'POSTGRES_PASSWORD=%s\nTUNNEL_TOKEN=unused\n' "$(openssl rand -hex 16)" > .env
          if ! docker compose up -d --wait --wait-timeout 180 share; then
            docker compose logs
            exit 1
          fi
          docker compose exec -T share share check > check.txt || true
          cat check.txt
          grep -q 'PostgreSQL at db/share, version 18' check.txt
          docker compose down -v
      - if: github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  app:
    name: App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Test (without the golden screenshots, which depend on font rendering)
        run: flutter test
      - name: Android unit tests and lint, both flavors
        run: |
          flutter build apk --config-only
          cd android
          ./gradlew --console=plain testDirectDebugUnitTest testPlayDebugUnitTest lintDirectDebug
      # The APK the server hands out, signed with the release key from the repository's secrets
      # (app/README.md says which). Only for pushes to this repository, never for pull requests.
      - name: Release key
        id: key
        if: github.event_name == 'push'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error::A release needs the signed APK: add the ANDROID_* secrets (app/README.md)."
            exit 1
          else
            echo "::notice::No APK: the ANDROID_* secrets for signing it aren't set (app/README.md)."
          fi
      - name: Signed APK for the server
        if: steps.key.outputs.present == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/share-release.jks"
          # key.properties is read as Java properties, where a backslash escapes.
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
          {
            echo "storeFile=$RUNNER_TEMP/share-release.jks"
            echo "storePassword=$(esc "$STORE_PASSWORD")"
            echo "keyAlias=$(esc "$KEY_ALIAS")"
            echo "keyPassword=$(esc "$KEY_PASSWORD")"
          } > android/key.properties
          flutter build apk --flavor direct --release
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-direct-release.apk ../dist/share.apk
          # The server takes the version from share.apk.json next to the APK (pubspec: name+code).
          version=$(sed -n 's/^version: *//p' pubspec.yaml)
          printf '{"version_code": %s, "version_name": "%s"}\n' "${version#*+}" "${version%+*}" > ../dist/share.apk.json
          cat ../dist/share.apk.json
      - name: Forget the release key
        if: always() && steps.key.outputs.present == 'true'
        run: rm -f android/key.properties "$RUNNER_TEMP/share-release.jks"
      - uses: actions/upload-artifact@v7
        if: steps.key.outputs.present == 'true'
        with:
          name: share-apk
          path: dist/
          retention-days: 1

  release:
    name: Release
    if: github.ref_type == 'tag'
    needs: [server, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: share-*
          path: dist
          merge-multiple: true
      - name: Publish
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum share* > SHA256SUMS
          # v0.2.0-rc1 and the like are marked as pre-releases.
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $pre
