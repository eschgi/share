# Share behind nginx on the same machine. Share's config.json:
# "http": {"listen": "127.0.0.1:8080"}, "proxy": "x-forwarded".
# The certificate lines come from `certbot --nginx -d share.example.com`.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name share.example.com;

    # ssl_certificate     /etc/letsencrypt/live/share.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/share.example.com/privkey.pem;

    # Uploads come in pieces of 20 MiB (upload.chunk_size_mib); nginx allows 1 MB unless told.
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Keep the visitor's Host, and say who is visiting and how; Share needs both.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass uploads and downloads on as they come, without holding them on disk first.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name share.example.com;
    return 301 https://$host$request_uri;
}
