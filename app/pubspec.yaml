name: share_app
description: "Share: see, download and send the files of a Share server."
publish_to: 'none'
# name+code: the code goes into versionCode and must grow with every release.
version: 0.3.0+3

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Few on purpose. Everything that moves bytes or needs Android lives in Kotlin
  # (android/app/src/main/kotlin): secrets, the route to the server, downloads.
  #
  # http   - small, and package:http/testing.dart's MockClient carries the tests.
  # clock  - makes time controllable in tests (fake_async installs it).
  # crypto - the SHA-256 of the local certificate, inside the synchronous TLS callback.
  # intl   - dates, numbers and plurals in three languages.
  # qr     - the QR codes of invites and PINs, drawn by our own painter.
  # video_player - the Flutter team's player (media3 on Android): videos and sound play in
  #          the viewer instead of another app.
  http: ^1.6.0
  clock: ^1.1.2
  crypto: ^3.0.6
  intl: any
  qr: ^4.0.0
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif-Bold.ttf
          weight: 700
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-SemiBold.ttf
          weight: 600
    - family: Lucide
      fonts:
        - asset: assets/fonts/Lucide.ttf
  assets:
    - assets/fonts/OFL-NotoSerif.txt
    - assets/fonts/OFL-RobotoMono.txt
    - assets/fonts/LICENSE-Lucide.txt
